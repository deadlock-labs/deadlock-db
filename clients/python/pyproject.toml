[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "deadlockdb"
version = "0.1.0"
description = "Python client for deadlock-db vector database"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
# No external dependencies - uses only the standard library.

[project.urls]
Homepage = "https://github.com/deadlock-labs/deadlock-db"

[tool.setuptools.packages.find]
include = ["deadlockdb*"]
